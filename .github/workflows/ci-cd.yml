name: AgentFlow AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Suite
        env:
          SECRET_KEY: ci_test_secret_key_that_is_at_least_32_characters
        run: |
          python -m pytest backend/tests/

  build-docker:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        run: docker build -f Dockerfile.backend -t agentflow-backend:latest .

      - name: Build Frontend Image
        run: docker build -f frontend/Dockerfile.frontend -t agentflow-frontend:latest ./frontend
