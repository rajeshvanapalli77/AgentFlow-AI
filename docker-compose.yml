version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentflow_postgres
    environment:
      POSTGRES_DB: agentflow_db
      POSTGRES_USER: agentflow_user
      POSTGRES_PASSWORD: agentflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow_user -d agentflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: agentflow_chromadb
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: agentflow_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentflow_user:agentflow_password@postgres:5432/agentflow_db
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: agentflow_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
